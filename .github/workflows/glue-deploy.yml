name: Glue Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'glue/**'
      - 'src/scrape.py'
      - 'src/financials.py'
  pull_request:
    paths:
      - 'glue/**'
      - 'src/scrape.py'
      - 'src/financials.py'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -v

  deploy:
    name: Upload Glue Scripts
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package shared modules
        working-directory: src
        run: zip shared.zip scrape.py financials.py

      - name: Upload Glue scripts to S3
        run: |
          BUCKET="${{ secrets.S3_BUCKET }}"
          PREFIX="s3://${BUCKET}/glue-scripts"
          aws s3 cp glue/ingest.py     ${PREFIX}/ingest.py
          aws s3 cp glue/ingest_spy.py ${PREFIX}/ingest_spy.py
          aws s3 cp glue/silver.py     ${PREFIX}/silver.py
          aws s3 cp glue/gold.py       ${PREFIX}/gold.py
          aws s3 cp src/shared.zip     ${PREFIX}/shared.zip
