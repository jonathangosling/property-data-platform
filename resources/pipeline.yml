resources:
  pipelines:
    rightmove_pipeline:
      name: property-data-platform-pipeline
      serverless: true
      continuous: false
      channel: CURRENT

      libraries:
        - file:
            path: ../pipelines/silver.py
        - file:
            path: ../pipelines/gold.py

      # Tables stored at a known S3 path and registered in Hive metastore.
      # Portable — can be registered in Glue/Athena without any migration.
      storage: s3://${var.s3_bucket}/delta

      configuration:
        s3_bucket: ${var.s3_bucket}
