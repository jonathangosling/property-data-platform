resources:
  pipelines:
    rightmove_pipeline:
      name: property-data-platform-pipeline
      serverless: true
      continuous: false
      channel: CURRENT

      libraries:
        - file:
            path: ../pipelines/silver.py
        - file:
            path: ../pipelines/gold.py

      # Output tables registered in Unity Catalog under this schema.
      # Serverless pipelines require UC — see README for portability notes.
      catalog: main
      target: property_data

      configuration:
        s3_bucket: ${var.s3_bucket}
