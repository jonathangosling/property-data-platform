resources:
  pipelines:
    rightmove_pipeline:
      name: property-data-platform-pipeline
      serverless: true
      continuous: false
      channel: CURRENT

      libraries:
        - file:
            path: ./pipelines/bronze.py
        - file:
            path: ./pipelines/silver.py
        - file:
            path: ./pipelines/gold.py

      # Output tables registered in Unity Catalog under this schema.
      catalog: main
      target: property_data

      # External Delta table storage on S3 via UC external location.
      storage: s3://${var.s3_bucket}/delta

      configuration:
        s3_bucket: ${var.s3_bucket}
