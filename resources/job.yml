resources:
  jobs:
    scrape_job:
      name: property-data-platform-scrape

      # Runs every Monday and Friday at 08:00 London time.
      schedule:
        quartz_cron_expression: "0 0 8 ? * MON,FRI"
        timezone_id: "Europe/London"
        pause_status: PAUSED

      environments:
        - environment_key: scrape_env
          spec:
            client: "1"
            dependencies:
              - requests
              - beautifulsoup4
              - yfinance
              - pandas

      tasks:
        - task_key: scrape
          environment_key: scrape_env
          python_script_task:
            python_file: ./src/ingest.py
            parameters:
              - "--s3-bucket"
              - ${var.s3_bucket}

        - task_key: run_pipeline
          depends_on:
            - task_key: scrape
          pipeline_task:
            pipeline_id: ${resources.pipelines.rightmove_pipeline.id}
