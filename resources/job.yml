resources:
  jobs:
    scrape_job:
      name: property-data-platform-scrape

      # Runs every Monday and Friday at 08:00 London time.
      schedule:
        quartz_cron_expression: "0 0 8 ? * MON,FRI"
        timezone_id: "Europe/London"
        pause_status: UNPAUSED

      job_clusters:
        - job_cluster_key: scrape_cluster
          new_cluster:
            num_workers: 0
            spark_conf:
              spark.master: "local[*, 4]"
            node_type_id: m5.large
            spark_version: "15.4.x-scala2.12"
            aws_attributes:
              instance_profile_arn: ${var.instance_profile_arn}
              availability: SPOT_WITH_FALLBACK
            # Installs Chrome and ChromeDriver for Selenium.
            init_scripts:
              - workspace:
                  destination: /Shared/property-data-platform/install_chrome.sh

      tasks:
        - task_key: scrape
          job_cluster_key: scrape_cluster
          python_script_task:
            python_file: ./src/scrape.py
            parameters:
              - "--s3-bucket"
              - ${var.s3_bucket}
          libraries:
            - pypi:
                package: selenium==4.15.0
            - pypi:
                package: webdriver-manager==4.0.1
            - pypi:
                package: requests
            - pypi:
                package: yfinance
            - pypi:
                package: pandas

        - task_key: run_pipeline
          depends_on:
            - task_key: scrape
          pipeline_task:
            pipeline_id: ${resources.pipelines.rightmove_pipeline.id}
