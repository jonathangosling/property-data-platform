resources:
  jobs:
    scrape_job:
      name: property-data-platform-scrape

      # Runs every Monday and Friday at 08:00 London time.
      schedule:
        quartz_cron_expression: "0 0 8 ? * MON,FRI"
        timezone_id: "Europe/London"
        pause_status: PAUSED

      job_clusters:
        - job_cluster_key: scrape_cluster
          new_cluster:
            num_workers: 0
            spark_version: "15.4.x-scala2.12"
            node_type_id: m5.large
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
            aws_attributes:
              availability: SPOT_WITH_FALLBACK
              ebs_volume_type: GENERAL_PURPOSE_SSD
              ebs_volume_count: 1
              ebs_volume_size: 32

      tasks:
        - task_key: scrape
          job_cluster_key: scrape_cluster
          spark_python_task:
            python_file: ${workspace.file_path}/src/ingest.py
            parameters:
              - "--s3-bucket"
              - ${var.s3_bucket}
          libraries:
            - pypi:
                package: requests
            - pypi:
                package: beautifulsoup4
            - pypi:
                package: yfinance
            - pypi:
                package: pandas

        - task_key: run_pipeline
          depends_on:
            - task_key: scrape
          pipeline_task:
            pipeline_id: ${resources.pipelines.rightmove_pipeline.id}
