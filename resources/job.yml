resources:
  jobs:
    scrape_job:
      name: property-data-platform-scrape

      # Runs every Monday and Friday at 08:00 London time.
      schedule:
        quartz_cron_expression: "0 0 8 ? * MON,FRI"
        timezone_id: "Europe/London"
        pause_status: PAUSED

      tasks:
        - task_key: scrape
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/ingest
            base_parameters:
              s3_bucket: ${var.s3_bucket}

        - task_key: run_pipeline
          depends_on:
            - task_key: scrape
          pipeline_task:
            pipeline_id: ${resources.pipelines.rightmove_pipeline.id}
